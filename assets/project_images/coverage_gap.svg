<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1195 370" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <rect x="0" y="0" width="1195" height="370" fill="#f4f7fa"/>

  <!-- header bar -->
  <rect x="0" y="0" width="1195" height="40" fill="#eef1f5" stroke="#d7dee6" stroke-width="1"/>
  <circle cx="20" cy="20" r="4" fill="#2d4a6f"/>
  <text x="34" y="25" font-size="12" letter-spacing="1" fill="#49596a">COVERAGE GAP — BLE PROXIMITY VS. MIOTY/FMDN FALLBACK</text>

  <!-- BLE ZONE panel -->
  <rect x="16" y="60" width="480" height="294" rx="10" fill="#e9edf2" stroke="#d7dee6" stroke-width="1"/>
  <text x="40" y="94" font-size="14" font-weight="700" fill="#1a2332">BLE ZONE</text>

  <!-- phone receivers -->
  <g fill="#2d4a6f">
    <rect x="88" y="120" width="14" height="24" rx="2"/>
    <rect x="270" y="108" width="14" height="24" rx="2"/>
    <rect x="360" y="200" width="14" height="24" rx="2"/>
  </g>
  <text x="95" y="115" text-anchor="middle" font-size="9" fill="#4f5f70">PHONE</text>
  <text x="277" y="103" text-anchor="middle" font-size="9" fill="#4f5f70">PHONE</text>
  <text x="367" y="195" text-anchor="middle" font-size="9" fill="#4f5f70">PHONE</text>

  <!-- proximity circles (dashed, representing detection range) -->
  <circle cx="95" cy="150" r="65" fill="none" stroke="#2d4a6f" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.55"/>
  <circle cx="277" cy="140" r="65" fill="none" stroke="#2d4a6f" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.55"/>
  <circle cx="367" cy="225" r="65" fill="none" stroke="#2d4a6f" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.55"/>

  <!-- tag with tight fix -->
  <circle cx="190" cy="230" r="26" fill="#dbe4ee" stroke="#2d4a6f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="190" cy="230" r="5" fill="#2d4a6f"/>
  <text x="190" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">≈ 1–2 m</text>
  <text x="190" y="296" text-anchor="middle" font-size="10" fill="#4f5f70">typical BLE proximity fix</text>
  <text x="190" y="311" text-anchor="middle" font-size="9" fill="#8f9aa8">(RSSI-based, receiver nearby)</text>

  <!-- MIOTY ZONE panel -->
  <rect x="700" y="60" width="480" height="294" rx="10" fill="#e9edf2" stroke="#d7dee6" stroke-width="1"/>
  <text x="724" y="94" font-size="14" font-weight="700" fill="#1a2332">MIOTY / FMDN ZONE</text>

  <rect x="1130" y="108" width="14" height="24" rx="2" fill="#2d4a6f"/>
  <text x="1137" y="103" text-anchor="middle" font-size="9" fill="#4f5f70">GATEWAY</text>

  <circle cx="935" cy="220" r="95" fill="none" stroke="#2d4a6f" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.55"/>
  <circle cx="935" cy="220" r="4" fill="#2d4a6f"/>
  <text x="935" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">100 m accuracy radius</text>
  <text x="935" y="348" text-anchor="middle" font-size="10" fill="#4f5f70">real FMDN fix — validated on air</text>

  <!-- connecting degrade indicator -->
  <g>
    <line x1="510" y1="207" x2="686" y2="207" stroke="#8f9aa8" stroke-width="1.5" stroke-dasharray="2,4"/>
    <path d="M686,207 l-9,-5 l0,10 z" fill="#8f9aa8"/>
    <path d="M510,207 l9,-5 l0,10 z" fill="#8f9aa8"/>
    <text x="598" y="197" text-anchor="middle" font-size="10" fill="#6b7684">degrades gracefully,</text>
    <text x="598" y="222" text-anchor="middle" font-size="10" fill="#6b7684">never drops out</text>
  </g>
</svg>
