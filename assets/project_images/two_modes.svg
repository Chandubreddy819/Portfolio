<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1195 460" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <rect x="0" y="0" width="1195" height="460" fill="#f4f7fa"/>

  <rect x="0" y="0" width="1195" height="40" fill="#eef1f5" stroke="#d7dee6" stroke-width="1"/>
  <circle cx="20" cy="20" r="4" fill="#2d4a6f"/>
  <text x="34" y="25" font-size="12" letter-spacing="1" fill="#49596a">DUAL-MODE OPERATION — MEASURED SX1280 RF BEHAVIOUR</text>

  <!-- BLE PATH -->
  <text x="30" y="72" font-size="14" font-weight="700" fill="#1a2332">BLE / FMDN PATH</text>
  <text x="30" y="90" font-size="10.5" fill="#4f5f70">3 fixed advertising channels, ~15 ms per 3-channel burst</text>

  <g font-size="11" fill="#1a2332">
    <rect x="30" y="105" width="330" height="26" fill="#ffffff" stroke="#d7dee6"/>
    <text x="38" y="122">CH 37</text><text x="130" y="122">2402 MHz</text><text x="240" y="122" fill="#4f5f70">0xB8,0xC4,0xEC</text>

    <rect x="30" y="131" width="330" height="26" fill="#eef1f5" stroke="#d7dee6"/>
    <text x="38" y="148">CH 38</text><text x="130" y="148">2426 MHz</text><text x="240" y="148" fill="#4f5f70">0xBA,0x9D,0x89</text>

    <rect x="30" y="157" width="330" height="26" fill="#ffffff" stroke="#d7dee6"/>
    <text x="38" y="174">CH 39</text><text x="130" y="174">2480 MHz</text><text x="240" y="174" fill="#4f5f70">0xBE,0xC4,0x55</text>
  </g>

  <!-- BLE waterfall, redrawn from the real capture: 3 fixed-frequency columns, 3 synchronised burst events -->
  <text x="30" y="212" font-size="10.5" fill="#4f5f70">as seen in the RF capture (below) — 3 channels fire together, per burst:</text>
  <rect x="30" y="222" width="330" height="95" fill="#010a14" stroke="#d7dee6"/>
  <g fill="#4fd1ff">
    <rect x="53" y="238" width="13" height="4"/>
    <rect x="191" y="238" width="13" height="4"/>
    <rect x="329" y="238" width="13" height="4"/>

    <rect x="53" y="269" width="13" height="4"/>
    <rect x="191" y="269" width="13" height="4"/>
    <rect x="329" y="269" width="13" height="4"/>

    <rect x="53" y="300" width="13" height="4"/>
    <rect x="191" y="300" width="13" height="4"/>
    <rect x="329" y="300" width="13" height="4"/>
  </g>
  <text x="59" y="232" font-size="9" fill="#7fb3cc">37</text>
  <text x="197" y="232" font-size="9" fill="#7fb3cc">38</text>
  <text x="335" y="232" font-size="9" fill="#7fb3cc">39</text>
  <text x="356" y="332" font-size="9.5" fill="#8f9aa8" text-anchor="end">time → (3 advertising events shown)</text>

  <!-- SX1280 center block -->
  <rect x="430" y="150" width="335" height="90" rx="10" fill="#eef3f8" stroke="#2d4a6f" stroke-width="2"/>
  <text x="597" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#2d4a6f">SX1280</text>
  <text x="597" y="207" text-anchor="middle" font-size="11" fill="#49596a">2.4 GHz transceiver — one radio, two protocols</text>
  <text x="597" y="223" text-anchor="middle" font-size="9.5" fill="#8f9aa8">5 BLE cycles : 1 mioty cycle (firmware ratio)</text>
  <line x1="425" y1="195" x2="366" y2="195" stroke="#2d4a6f" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="770" y1="195" x2="828" y2="195" stroke="#2d4a6f" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <defs>
    <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#2d4a6f"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d4a6f"/></marker>
  </defs>

  <!-- MIOTY PATH -->
  <text x="835" y="72" font-size="14" font-weight="700" fill="#1a2332" text-anchor="start">MIOTY (TS-UNB) PATH</text>
  <text x="835" y="90" font-size="10.5" fill="#4f5f70">24 sub-bursts, ~5.5 s telegram, hopping the band</text>

  <rect x="835" y="105" width="330" height="212" fill="#010a14" stroke="#d7dee6"/>
  <!-- exactly 24 sub-burst ticks, as flat waterfall segments, matching the real capture's rendering style -->
  <g fill="#4fd1ff">
    <rect x="848" y="268" width="11" height="3.5"/>
    <rect x="862" y="148" width="11" height="3.5"/>
    <rect x="876" y="228" width="11" height="3.5"/>
    <rect x="890" y="288" width="11" height="3.5"/>
    <rect x="904" y="178" width="11" height="3.5"/>
    <rect x="918" y="253" width="11" height="3.5"/>
    <rect x="932" y="128" width="11" height="3.5"/>
    <rect x="946" y="208" width="11" height="3.5"/>
    <rect x="960" y="273" width="11" height="3.5"/>
    <rect x="974" y="163" width="11" height="3.5"/>
    <rect x="988" y="243" width="11" height="3.5"/>
    <rect x="1002" y="118" width="11" height="3.5"/>
    <rect x="1016" y="283" width="11" height="3.5"/>
    <rect x="1030" y="193" width="11" height="3.5"/>
    <rect x="1044" y="138" width="11" height="3.5"/>
    <rect x="1058" y="258" width="11" height="3.5"/>
    <rect x="1072" y="218" width="11" height="3.5"/>
    <rect x="1086" y="168" width="11" height="3.5"/>
    <rect x="1100" y="293" width="11" height="3.5"/>
    <rect x="1114" y="198" width="11" height="3.5"/>
    <rect x="1128" y="153" width="11" height="3.5"/>
    <rect x="1142" y="263" width="11" height="3.5"/>
    <rect x="1130" y="123" width="11" height="3.5"/>
    <rect x="1148" y="233" width="11" height="3.5"/>
  </g>
  <text x="852" y="120" font-size="9" fill="#7fb3cc">freq ↑</text>
  <text x="1155" y="330" font-size="9.5" fill="#8f9aa8" text-anchor="end">time (5.5 s, 24 sub-bursts) →</text>

  <!-- footnote -->
  <text x="30" y="425" font-size="10.5" fill="#6b7684">Both patterns confirmed on a spectrum analyzer — see the RF captures below.</text>
</svg>
