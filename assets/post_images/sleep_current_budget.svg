<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <rect x="0" y="0" width="1000" height="500" fill="#eef1f5"/>

  <text x="40" y="55" font-size="18" font-weight="700" fill="#1a2332">Where the average current actually goes</text>
  <text x="40" y="80" font-size="12" fill="#4f5f70">A device that sleeps 99%+ of the time — idle current dominates, not peak current</text>

  <!-- stacked bar: sleep vs active contributions -->
  <g>
    <rect x="40" y="140" width="920" height="70" rx="6" fill="#dbe4ee" stroke="#2d4a6f" stroke-width="1.5"/>
    <rect x="40" y="140" width="640" height="70" fill="#2d4a6f" opacity="0.85"/>
    <rect x="680" y="140" width="180" height="70" fill="#5c7ea3"/>
    <rect x="860" y="140" width="100" height="70" fill="#9aa7b5"/>
  </g>
  <text x="360" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">sleep baseline</text>
  <text x="770" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">duty-cycled TX</text>
  <text x="910" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2332">MCU active</text>

  <text x="40" y="232" font-size="11" fill="#6b7684">A single unclamped GPIO leaking tens of µA in "sleep" can outweigh the entire TX contribution above.</text>

  <!-- three pattern cards -->
  <g>
    <rect x="40" y="270" width="280" height="180" rx="10" fill="#ffffff" stroke="#d7dee6"/>
    <text x="60" y="300" font-size="13" font-weight="700" fill="#2d4a6f">1. Budget backwards</text>
    <text x="60" y="325" font-size="10.5" fill="#49596a">Target lifetime → average</text>
    <text x="60" y="340" font-size="10.5" fill="#49596a">current ceiling. That ceiling</text>
    <text x="60" y="355" font-size="10.5" fill="#49596a">is the real spec, not the</text>
    <text x="60" y="370" font-size="10.5" fill="#49596a">datasheet's sleep number.</text>

    <rect x="360" y="270" width="280" height="180" rx="10" fill="#ffffff" stroke="#d7dee6"/>
    <text x="380" y="300" font-size="13" font-weight="700" fill="#2d4a6f">2. Clamp shared pins</text>
    <text x="380" y="325" font-size="10.5" fill="#49596a">A peripheral's driven line</text>
    <text x="380" y="340" font-size="10.5" fill="#49596a">into a "sleeping" digital</text>
    <text x="380" y="355" font-size="10.5" fill="#49596a">input is a classic silent</text>
    <text x="380" y="370" font-size="10.5" fill="#49596a">leak. Set it analog before sleep.</text>

    <rect x="680" y="270" width="280" height="180" rx="10" fill="#ffffff" stroke="#d7dee6"/>
    <text x="700" y="300" font-size="13" font-weight="700" fill="#2d4a6f">3. Verify the wake</text>
    <text x="700" y="325" font-size="10.5" fill="#49596a">Confirm current drops back</text>
    <text x="700" y="340" font-size="10.5" fill="#49596a">to baseline after one cycle —</text>
    <text x="700" y="355" font-size="10.5" fill="#49596a">an uncleared alarm flag wakes</text>
    <text x="700" y="370" font-size="10.5" fill="#49596a">the device continuously.</text>
  </g>
</svg>
