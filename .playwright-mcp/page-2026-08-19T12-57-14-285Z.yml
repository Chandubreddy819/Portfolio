        - generic [ref=f5e28]:
          - generic [ref=f5e29]:
            - generic [ref=f5e30]: The Coverage Gap
            - paragraph [ref=f5e31]: "Most asset-tracking tags are built around a single trade-off. BLE tags are cheap and accurate when a receiver is nearby — but the moment the tag drifts out of range, it goes dark. Long-range IoT radios solve coverage, but at the cost of energy and precision. This project asks a different question: what if one tag could do both on a single radio? The result is a joint BLE + mioty module that transmits frequent BLE advertisements for precise tracking near infrastructure, and occasional mioty telegrams for long-range fallback everywhere else — both from the same 2.4 GHz front end."
            - generic [ref=f5e32]:
              - img "The Coverage Gap" [ref=f5e33]
              - generic [ref=f5e34]: Fig 1 — BLE delivers precise position within gateway range; mioty maintains coarse coverage almost everywhere. A dual-mode tag combines both vs tracking degrades gracefully rather than dropping out at the coverage edge.
          - generic [ref=f5e35]:
            - generic [ref=f5e36]: Two Modes, One Radio
            - paragraph [ref=f5e37]: "Mioty is built on Telegram Splitting (ETSI TS-UNB): instead of one continuous packet, it chops messages into small sub-packets scattered across time and frequency. A receiver needs only a fraction of them to reconstruct the message — giving mioty its robust long-range edge. The novelty here is bringing that approach onto the same 2.4 GHz front end as BLE. BLE handles the common case with ~4 Hz three-channel hops for fine-grained tracking. mioty handles the fallback with infrequent split telegrams that stay robust even when BLE coverage is absent. The two are complementary, not redundant — and both share a single SX1280 transceiver and antenna."
            - generic [ref=f5e38]:
              - img "Two Modes, One Radio" [ref=f5e39]
              - generic [ref=f5e40]: Fig 2 — The SX1280 generates both radio modes. BLE hops the three advertising channels at ~4 Hz for fine-grained tracking. mioty scatters sub-packets across a time-frequency grid for robust long-range fallback.
          - generic [ref=f5e41]:
            - generic [ref=f5e42]: Module Architecture
            - paragraph [ref=f5e43]: "The whole design bends toward one constraint: run from a CR2032 coin cell. The Semtech SX1280 handles both radio roles from a single 2.4 GHz front end. The STM32F103CB orchestrates everything — building BLE advertising packets, driving the mioty telegram sequence, reading the IMU, and managing sleep. A 9-axis IMU (TDK ICM-42688 / ST ISM330DLC) does double duty: its hardware wake-on-motion interrupt keeps the STM32 in deep sleep when the tag is stationary, and its motion data feeds the localization layer for dead-reckoning between radio fixes."
            - generic [ref=f5e44]:
              - img "Module Architecture" [ref=f5e45]
              - generic [ref=f5e46]: Fig 3 — Component topology. STM32F103CB at the centre drives the SX1280 over SPI and the 9-axis IMU over I2C. The IMU's wake-on-motion interrupt keeps the MCU in deep sleep when stationary, dramatically extending coin-cell life.
          - generic [ref=f5e47]:
            - generic [ref=f5e48]: The Board
            - paragraph [ref=f5e49]: A custom four-layer PCB designed in KiCad — a compact round board sized to sit over a coin cell. The stackup gives the 2.4 GHz signals a clean reference plane and keeps the antenna matching network tight. The design is complete and fabricated; the bill of materials is deliberately small.
            - generic [ref=f5e50]:
              - img "The Board" [ref=f5e51]
              - generic [ref=f5e52]: Fig 4 — Round four-layer PCB. Meander-line inverted F antenna (IFA) at the top edge; SX1280 RF module nearest the antenna; STM32 in the center; CR2032 battery holder on the bottom. Top right shows the U.FL connector for bench testing alongside the etched antenna.
          - generic [ref=f5e53]:
            - generic [ref=f5e54]: Bringing Up the Radio
            - paragraph [ref=f5e55]: "The firmware is written in C against the STM32 HAL. The BLE path is working and verified; the tag is discoverable on standard scanners, confirmed in nRF Connect and Bluetooth LE Explorer. The SX1280 is configured for BLE at 1 Mbps with Gaussian shaping, transmitting Google's Find My Device Network (FMDN) format across all three advertising channels at ~4 Hz. The mioty transmit path is confirmed working on air too — the telegram-splitting sub-burst pattern is clearly visible on a spectrum analyzer, scattered across time and frequency exactly as the TS-UNB standard predicts. Power optimization is in place: the IMU's hardware wake-on-motion interrupt keeps the STM32 in deep sleep when the tag is stationary; ramps advertising back up the instant movement is detected; and provides dead-reckoning hints to the localization layer."
            - generic [ref=f5e56]:
              - img "Bringing Up the Radio" [ref=f5e57]
              - generic [ref=f5e58]: "Fig 5 — Real-time spectrum capture of a mioty uplink: sub-bursts scattered across time and frequency, the telegram-splitting signature that lets a gateway reconstruct the message even if some sub-bursts are lost to interference."
          - generic [ref=f5e59]:
            - generic [ref=f5e60]: Two Bugs Worth Mentioning
            - paragraph [ref=f5e61]: "The radio looked fine on a spectrum analyzer and still didn't work — a good reminder that \"visible on air\" and \"decodable\" aren't the same thing. The mioty gateway couldn't decode telegrams that were, on inspection, correctly formed and hopping exactly where they should. The culprit was the 8 MHz crystal: its load capacitors didn't match the crystal's specified load, pulling the oscillator slightly off nominal. A single symbol's timing error from that was negligible, but accumulated across a 5.5-second, 24-sub-burst telegram it was enough to push the whole transmission out of the gateway's alignment window. Recalculating and swapping the load capacitors fixed it at the hardware level — no firmware compensation needed. The second bug was in the compass heading, not the radio. A bench rig built to sanity-check the heading math before trusting it on a real transmission showed the computed angle stuck in a narrow arc instead of sweeping the full 360°. The raw magnetometer readings were tracing a circle offset from the origin — hard-iron distortion from nearby ferrous material and the sensor's own bias — so `atan2()` could only ever see the angles that offset circle actually subtends. A one-time calibration at boot (rotate the board through a full turn for 15 seconds, track the min/max reading on each axis, and use the midpoint as an offset) re-centers the circle and fixes it."
          - generic [ref=f5e62]:
            - generic [ref=f5e63]: From Signals to a Map
            - paragraph [ref=f5e64]: "Hardware that transmits is only half a localization system — something has to turn a broadcast into a resolved position. On the BLE side, the tag advertises Google's Find My Device Network (FMDN) format rather than a custom payload, so any nearby Android phone with Find My Device enabled can anonymously report having seen it, no dedicated receiver infrastructure required. A companion service requests those reports from Google's API, decrypts them with the tag's own key, and serves the resolved position to a Leaflet-based dashboard. This path is validated end to end, not just designed: a real Android phone in the field observed the tag, and the dashboard below resolved a genuine, geographically correct position for it. The equivalent path on the mioty side — a gateway that turns received uplinks into a position of its own — is the clear next step; the uplink itself reaches the gateway correctly today, but nothing downstream yet turns it into a plotted position the way the BLE/FMDN path does."
            - generic [ref=f5e65]:
              - img "From Signals to a Map" [ref=f5e66]
              - generic [ref=f5e67]: "Fig 6 — The dashboard resolving a real, decrypted position for the tracker from a genuine third-party observation: ≈49.598°N, 11.002°E in Erlangen, 100m accuracy, status AGGREGATED."
          - generic [ref=f5e68]:
            - generic [ref=f5e69]: Why It Matters
            - paragraph [ref=f5e70]: The appeal of this design is its economy. A single transceiver, a small microcontroller, a 9-axis IMU, and a coin cell; and from that minimal hardware comes a tag that is precise when it can be and reliable when it can't. There is no second radio to power, no gateway density assumption baked into the deployment, no hard coverage edge where tracking simply stops. A tiny module that transmits frequent BLE advertisements for precise tracking where possible, and occasional mioty telegrams for long-range fallback everywhere else. The board is complete and verified, both radios are confirmed working on air, and the BLE/FMDN path is validated end to end with a real, resolved position — the mioty-side gateway localization software is the clear next step. This work is being carried out at the Institute for Information Technology (LIKE), FAU Erlangen-Nürnberg.
