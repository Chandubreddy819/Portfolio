        - generic [ref=f5e11]: PROJECT 01 · IoT · RF Hardware · Localization
      - heading "Joint Bluetooth and Mioty Localization Tag" [level=1] [ref=f5e12]
      - paragraph [ref=f5e13]: A coin-cell BLE + mioty localization tag combining precise short-range tracking with long-range fallback — one 2.4 GHz transceiver, motion-gated power, and a 9-axis IMU on a custom circular PCB.
