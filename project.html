<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting…</title>
    <script>
      (function () {
        var id = new URLSearchParams(window.location.search).get('id');
        var target = id
          ? '{{ "/projects/" | relative_url }}' + id + '/'
          : '{{ "/projects.html" | relative_url }}';
        window.location.replace(target);
      })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="{{ '/projects.html' | relative_url }}">Projects</a>…</p>
</body>
</html>
